<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Calendar | Run Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Calandrier de Course</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="runs.html">Calandrier</a>
            <a href="login.html">Connexion</a>
        </nav>
    </header>

    <main>
        <section class="calendar-controls">
            <button id="prevMonth" class="btn">Précédent</button>
            <h2 id="currentMonth"></h2>
            <button id="nextMonth" class="btn">Suivant</button>
        </section>

        <!--<section class="calendar">
            <div class="calendar-header">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>
            <div id="calendarDays" class="calendar-days">
                 Days will be populated by runs.js 
            </div>
        </section>-->

        <div class="weekly-schedule">
            <div class="day-card">
                <div class="day-header">Lundi</div>
                <div class="day-content" id="mon">Loading...</div>
            </div>
            <div class="day-card">
                <div class="day-header">Mardi</div>
                <div class="day-content" id="tue">Loading...</div>
            </div>
            <div class="day-card">
                <div class="day-header">Mercredi</div>
                <div class="day-content" id="wed">Loading...</div>
            </div>
            <div class="day-card">
                <div class="day-header">Jeudi</div>
                <div class="day-content" id="thu">Loading...</div>
            </div>
            <div class="day-card">
                <div class="day-header">Vendredi</div>
                <div class="day-content" id="fri">Loading...</div>
            </div>
            <div class="day-card">
                <div class="day-header">Samedi</div>
                <div class="day-content" id="sat">Loading...</div>
            </div>
            <div class="day-card">
                <div class="day-header">Dimanche</div>
                <div class="day-content" id="sun">Loading...</div>
            </div>
        </div>

        <section id="runDetails" class="run-details">
            <h3>Course d'aujourd'hui</h3>
            <p id="selectedDate"></p>
            <p id="runDescription">Choisissez un jour pour voir votre course</p>
        </section>
    </main>

    <script src="runs.js"></script>
    <script src="header.js?v=5"></script>
</body>

</html>
